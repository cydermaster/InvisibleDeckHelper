[package]
name = "invisible-deck-helper"
version = "1.1.0"
edition = "2021"
description = "Practice aid for the Invisible Deck card trick"
license = "MIT"

[[bin]]
name = "invisible-deck-helper"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.29"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
