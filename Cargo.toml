[package]
name = "invisible-deck-helper"
version = "1.2.0"
edition = "2021"
description = "Practice aid for the Invisible Deck card trick"
license = "MIT"

[[bin]]
name = "invisible-deck-helper"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.29"

# Wayland and X11 are Linux-only winit backends. Keeping them in a target
# section means the Windows build does not reference them at all.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "wayland",
    "x11",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
